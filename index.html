<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harry's Room</title>
  <style>
    /* Basis-Reset */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #ffffff;
      color: #333;
    }

    /* 1. Header-Icons ganz oben */
    .top-header-icons {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      padding: 10px;
      background-color: #ffffff;
      border-bottom: 1px solid #eeeeee;
      flex-wrap: wrap;
    }

    .icon-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      color: #333333;
      font-size: 0.9rem;
      font-weight: 500;
    }

    .icon-link svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    /* 2. Info-Bar: Öffnungszeiten & Live-Uhrzeit */
    .header-info-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #f8f9fa;
      padding: 8px 15px;
      font-size: 0.85rem;
      border-bottom: 1px solid #e0e0e0;
      color: #333;
    }

    .opening-hours strong,
    .live-clock strong {
      color: #111;
    }

    .live-clock span {
      font-weight: bold;
      color: #007bff;
    }

    /* Mobile Darstellung */
    @media (max-width: 600px) {
      .top-header-icons {
        gap: 10px;
        font-size: 0.85rem;
      }

      .header-info-bar {
        flex-direction: column;
        gap: 4px;
        text-align: center;
      }
    }

    /* 3. Platzhalter für den Rest deines Shops */
    .shop-container {
      padding: 40px 20px;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- TOP HEADER ICONS -->
  <div class="top-header-icons">
    <a href="tel:+49123456789" class="icon-link">
      <svg viewBox="0 0 24 24"><path d="M6.62 10.79a15.053 15.053 0 006.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
      <span>Telefon</span>
    </a>

    <a href="https://wa.me/49123456789" target="_blank" class="icon-link">
      <svg viewBox="0 0 24 24"><path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.816 9.816 0 0012.04 2zm5.79 14.12c-.24.68-1.2 1.25-1.92 1.29-.49.03-1.12.16-3.28-.72-2.77-1.13-4.54-3.95-4.68-4.14-.14-.19-1.12-1.49-1.12-2.84 0-1.35.7-2.01.95-2.28.25-.27.55-.34.73-.34.18 0 .36 0 .52.01.17.01.4.01.58.45.2.48.68 1.66.74 1.78.06.12.1.27.02.43-.08.16-.12.26-.24.4-.12.14-.25.31-.36.42-.12.12-.24.25-.1.49.14.24.62 1.02 1.33 1.65.91.81 1.68 1.06 1.92 1.18.24.12.38.1.52-.06.14-.16.6-0.7.76-.94.16-.24.32-.2.54-.12.22.08 1.4.66 1.64.78.24.12.4.18.46.28.06.1.06.58-.18 1.26z"/></svg>
      <span>WhatsApp</span>
    </a>

    <a href="#" class="icon-link">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
      <span>mea</span>
    </a>

    <a href="#" class="icon-link">
      <svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
      <span>Online Shop</span>
    </a>
  </div>

  <!-- LEISTE UNTER DEN ICONS: ÖFFNUNGSZEITEN & UHRZEIT -->
  <div class="header-info-bar">
    <div class="opening-hours">
      <strong>Öffnungszeiten:</strong> Mo–Fr: 09:00 – 18:00 Uhr | Sa: 09:00 – 14:00 Uhr
    </div>
    <div class="live-clock">
      <strong>Aktuelle Uhrzeit:</strong> <span id="liveClock">--:--:--</span>
    </div>
  </div>

  <!-- SHOP CONTENT / RESTE DER WEBSEITE -->
  <main class="shop-container">
    <!-- Hier fügst du deinen bisherigen Artikel- und Content-Bereich ein -->
  </main>

  <!-- LIVE-UHR JAVASCRIPT -->
  <script>
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      
      const clockElement = document.getElementById('liveClock');
      if (clockElement) {
        clockElement.textContent = `${hours}:${minutes}:${seconds} Uhr`;
      }
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>

</body>
</html>
